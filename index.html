<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FDF6EC" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="FloraLens" />
  <meta name="application-name" content="FloraLens" />
  <meta name="format-detection" content="telephone=no" />
  <title>FloraLens</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,500..700,0..100;1,9..144,500..700,0..100&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=3.2.0" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="round-btn ghost" id="menuBtn" aria-label="Open menu">☰</button>
      <button class="brand" data-route="home" aria-label="FloraLens home">
        <span class="brand-flower">✿</span>
        <span>FloraLens</span>
      </button>
      <button class="round-btn ghost" id="profileBtn" aria-label="Discover" data-route="discover">♡</button>
    </header>

    <main id="view"></main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button data-route="home" class="nav-item active"><span>⌂</span><small>Home</small></button>
      <button data-route="garden" class="nav-item"><span>❧</span><small>Garden</small></button>
      <button data-route="lens" class="lens-nav" aria-label="Identify a plant"><span>⌾</span></button>
      <button data-route="journal" class="nav-item"><span>☷</span><small>Journal</small></button>
      <button data-route="discover" class="nav-item"><span>♡</span><small>Discover</small></button>
    </nav>
  </div>

  <div id="rotateNotice" aria-hidden="true">
    <svg viewBox="0 0 64 64" width="64" height="64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="20" y="8" width="24" height="44" rx="5"/><path d="M29 46h6"/><path d="M50 22a16 16 0 0 1 4 18"/><path d="M54 40l-1-7-6 3"/></svg>
    <b>Turn your phone upright</b>
    <small>FloraLens is designed for portrait.</small>
  </div>

  <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden />
  <input id="galleryInput" type="file" accept="image/*" hidden />
  <input id="multiPhotoInput" type="file" accept="image/*" capture="environment" hidden />
  <input id="doctorCameraInput" type="file" accept="image/*" capture="environment" hidden />
  <script src="icons.js?v=3.2.0"></script>
  <script src="traits.js?v=3.2.0"></script>
  <script src="phenology.js?v=3.2.0"></script>
  <script src="app.js?v=3.2.0"></script>
</body>
</html>
