<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f1e7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>FloraLens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=0.9" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="round-btn ghost" id="menuBtn" aria-label="Open menu">☰</button>
      <button class="brand" data-route="home" aria-label="FloraLens home">
        <span class="brand-flower">✿</span>
        <span>FloraLens</span>
      </button>
      <button class="round-btn ghost" id="profileBtn" aria-label="Profile">♡</button>
    </header>

    <main id="view"></main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button data-route="home" class="nav-item active"><span>⌂</span><small>Home</small></button>
      <button data-route="garden" class="nav-item"><span>❧</span><small>Garden</small></button>
      <button data-route="lens" class="lens-nav" aria-label="Open FloraLens camera"><span>⌾</span></button>
      <button data-route="journal" class="nav-item"><span>☷</span><small>Journal</small></button>
      <button data-route="discover" class="nav-item"><span>♡</span><small>Discover</small></button>
    </nav>
  </div>

  <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden />
  <input id="galleryInput" type="file" accept="image/*" hidden />
  <input id="multiPhotoInput" type="file" accept="image/*" capture="environment" hidden />
  <script src="traits.js?v=0.8.1"></script>
  <script src="app.js?v=0.9"></script>
</body>
</html>
